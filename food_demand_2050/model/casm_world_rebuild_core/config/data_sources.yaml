schema_version: 1

# This project may read upstream data only from this immutable, verified
# snapshot root.  Paths below are relative so that ``..`` escapes and
# accidental dependencies on another model tree can be rejected centrally.
contract:
  trusted_raw_root: /root/data/CASM/casm_world_2050/data/raw
  source_manifest: /root/data/CASM/casm_world_2050/data/metadata/source_manifest.csv
  required_manifest_status: verified
  allowed_providers:
    - FAOSTAT
    - IIASA
    - United Nations Statistics Division
    - United Nations Population Division
    - USDA ERS
    - World Bank
  forbidden_path_fragments:
    - SILK Model
    - bilateral
  forbidden_roots:
    - /root/data/CASM/casm_world
    - /root/data/CASM/casm_py/casm_world

