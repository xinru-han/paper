version: 0.1.0
historical_source: USDA-IAP-2023
estimation_window: [2013, 2023]
country_weight: 0.70
fallback: usda_region_median_then_global_median
annual_log_rate_bounds: [-0.005, 0.035]

# These are explicit CASM-World scenario assumptions, not official IIASA TFP
# projections. They multiply the estimated country trend.
ssp_rate_multipliers:
  SSP1: 1.15
  SSP2: 1.00
  SSP3: 0.70
  SSP4: 0.85
  SSP5: 1.10

