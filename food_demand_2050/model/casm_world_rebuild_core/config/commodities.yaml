    balance: {domain: SUA, items: [900]}
    activity: {domain: QCL, items: [900]}
    processing: dairy_solids

processing_systems:
  rice_milling:
    primary_account: RIC
    validation_trade_basis: milled_rice
    rule: never_add_paddy_and_milled_equivalents
  soybean_crush:
    input: SBS
    outputs: {SBO: 0.1859, SBM: 0.7766}
    residual: 0.0375
  sunflower_crush:
    input: NBS
    outputs: {NBO: 0.4347, NBM: 0.4455}
    residual: 0.1198
  rapeseed_crush:
    input: RBS
    outputs: {RBO: 0.4121, RBM: 0.5618}
    residual: 0.0261
  cotton_ginning:
    input_activity: seed_cotton
    outputs: {CTN: 0.3352, cottonseed_satellite: 0.5565}
    residual: 0.1083
  sugar_refining:
    inputs: {SCA: 0.1003, SBE: 0.1607}
    output: SUG
  dairy_solids:
    input: MLK
    outputs: [BUT, CHE, NDM, FMK, WDM, ODA]
    rule: joint_milk_fat_and_nonfat_solids_balance
  ethanol:
    outputs: [ETH, DDG]
  biodiesel:
    output: BDI
