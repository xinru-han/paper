  FMK:
    name: Fluid milk used as food
    class: dairy_product
    balance: {domain: SUA, items: [882, 951, 982, 1020, 1130], element: food}
    processing: dairy_solids
  WDM:
    name: Whole milk powder
    class: dairy_product
    balance: {domain: SUA, items: [897]}
    activity: {domain: QCL, items: [897]}
