scope_evidence:
  UNSD_NATIONAL_ACCOUNTS_SCOPE:
    publisher: United Nations Statistics Division
    title: "National Accounts Statistics: Analysis of Main Aggregates, 2024"
    url: https://unstats.un.org/unsd/nationalaccount/sdpubs/AMA-2024.pdf
    finding: >-
      The country-scope notes state that France includes French Guiana,
      Guadeloupe, Martinique, Mayotte and Réunion, and Morocco includes
      Western Sahara.
  INSEE_FRANCE_SCOPE:
    publisher: Insee
    title: Overseas departments, regions and collectivities
    url: https://www.insee.fr/en/metadonnees/definition/c2316
    finding: >-
      France's national-accounts territory comprises metropolitan France, the
      five overseas departments/regions, and Saint Martin; the other listed
      overseas collectivities are outside that national-accounts perimeter.
  BEA_US_TERRITORIES:
    publisher: U.S. Bureau of Economic Analysis
    title: Are Puerto Rico and the U.S. Territories included in U.S. GDP?
    url: https://www.bea.gov/help/faq/1188
    finding: >-
      U.S. NIPA GDP excludes U.S. commonwealths and territories; BEA produces
      separate GDP estimates for American Samoa, Guam, Northern Mariana
      Islands and the U.S. Virgin Islands.
  CBS_NETHERLANDS_SCOPE:
    publisher: Statistics Netherlands
    title: National accounts of the Netherlands 2019
    url: https://www.cbs.nl/-/media/_pdf/2020/29/2020a402-national-accounts-2019.pdf
    finding: >-
      Dutch national accounts cover the Kingdom in Europe and explicitly
      exclude Bonaire, Sint Eustatius and Saba.
  DST_DENMARK_SCOPE:
    publisher: Statistics Denmark
    title: National Accounts, Quarterly - Statistical presentation
    url: https://www.dst.dk/en/Statistik/dokumentation/documentationofstatistics/national-accounts--quarterly/statistical-presentation
    finding: Danish national accounts exclude the Faroe Islands and Greenland.
  ONS_UK_SCOPE:
    publisher: Office for National Statistics
    title: An introduction to the UK National Accounts
    url: https://www.ons.gov.uk/economy/grossdomesticproductgdp/compendium/unitedkingdomnationalaccountsthebluebook/2024/anintroductiontotheuknationalaccounts
    finding: >-
      UK economic territory is Great Britain and Northern Ireland and excludes
      Crown dependencies; UK overseas territories are outside that perimeter.
  STATS_NZ_SCOPE:
    publisher: Stats NZ
    title: New Zealand geographic definition
    url: https://datainfoplus.stats.govt.nz/item/nz.govt.stats/69e44e22-2fa4-4e94-aeb7-742793fd4c1e/1
    finding: Geographic New Zealand excludes Niue and Tokelau.
  NBS_CHINA_SCOPE:
    publisher: National Bureau of Statistics of China
    title: China Statistical Yearbook 2025 - Editor's Notes
    url: https://www.stats.gov.cn/sj/ndsj/2025/html/notee.htm
    finding: >-
      Mainland national data exclude Hong Kong SAR, Macao SAR and the Taiwan
      statistical area; TWN therefore cannot be added to the CHN account.
