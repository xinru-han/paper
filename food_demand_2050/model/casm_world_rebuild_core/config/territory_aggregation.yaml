schema_version: "1.0"
benchmark_year: 2023
mapping_purpose: >-
  Collapse 25 statistical territories into sovereign-parent or named regional
  accounting targets while retaining each source territory's original M49
  reporting geography. These mappings are analytical conventions and do not
  express a position on sovereignty or territorial status.

invariants:
  expected_source_territories: 25
  source_model_entity: false
  retain_classification_metadata: true
  mapping_cardinality: many_to_one
  population_aggregation: sum
  gdp_aggregation: sum_of_scope_exclusive_contributions
  product_quantity_aggregation: sum
  duplicate_source_rows_within_slice: error
  null_additive_values: error
  note: >-
    GDP supplied to the additive aggregation function must be scope-exclusive.
    Where a published parent GDP already contains a territory, do not also
    supply that territory's GDP as an additive contribution. Where the parent
    GDP excludes it, a non-null supplemental GDP contribution is required.

# M49 region and most-specific reporting-area codes used below. For the
# Americas and Sub-Saharan Africa, reporting_subregion_target uses the M49
# intermediate region (for example Caribbean or Eastern Africa); otherwise it
# uses the M49 sub-region. This preserves the geography of the source data.
reporting_regions:
  "002": Africa
  "009": Oceania
  "019": Americas
  "142": Asia
  "150": Europe

reporting_subregions:
  "005": South America
  "011": Western Africa
  "014": Eastern Africa
  "015": Northern Africa
  "021": Northern America
  "029": Caribbean
  "030": Eastern Asia
  "039": Southern Europe
  "057": Micronesia
  "061": Polynesia
  "154": Northern Europe

accounting_targets:
  USA:
    name: United States
    target_type: sovereign_parent_account
    model_entity: true
  NLD:
    name: Netherlands
    target_type: sovereign_parent_account
    model_entity: true
  FRA:
    name: France
    target_type: sovereign_parent_account
    model_entity: true
  MAR:
    name: Morocco
    target_type: sovereign_parent_account
    model_entity: true
  GBR:
    name: United Kingdom
    target_type: sovereign_parent_account
    model_entity: true
  DNK:
    name: Denmark
    target_type: sovereign_parent_account
    model_entity: true
  NZL:
    name: New Zealand
    target_type: sovereign_parent_account
    model_entity: true
  OTHER_EASTERN_ASIA:
    name: Other Eastern Asia
    target_type: named_regional_account
    model_entity: true
    note: >-
      Separate regional accounting target for TWN. It is never merged into
      CHN or included in mainland-China focus results.

# GDP scope actions are deliberately explicit:
# - already_in_accounting_target: the parent GDP already covers the territory;
#   adding a separate territory GDP would double count.
# - add_source_gdp_to_accounting_target: the parent GDP excludes the territory;
#   a scope-exclusive supplemental GDP contribution must be added.
territory_mappings:
  - source_economy_id: ASM
    source_name: American Samoa
    source_m49: "016"
    model_entity: false
    retain_classification_metadata: true
    accounting_target: USA
    reporting_region_target: "009"
    reporting_subregion_target: "061"
    gdp_scope_action: add_source_gdp_to_accounting_target
    scope_evidence: BEA_US_TERRITORIES

  - source_economy_id: BES
    source_name: Bonaire, Sint Eustatius and Saba
    source_m49: "535"
    model_entity: false
    retain_classification_metadata: true
