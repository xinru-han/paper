[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casm-world-2050"
version = "0.2.0"
description = "Clean 2023-based CASM-World partial-equilibrium rebuild"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "PyYAML>=5.4",
  "openpyxl>=3.1",
  "lxml>=5.0",
  "matplotlib>=3.8",
  "xlrd>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
