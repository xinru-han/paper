project:
  name: food_demand_2050
  repository_path: food_demand_2050
  manuscript: manuscript/manuscript_v2.md
  target_journal_route: Global Food Security or Food Policy
  current_scope_note: Sequentially linked CASM and CASM-World scenario analysis.

model:
  casm_version: v2.2.7
  casm_commodity_count: 37
  casm_world_regions: 13
  casm_world_commodity_count: 31
  base_year_china: 2023
  base_year_world: 2024
  shock_start_year_world: 2025
  final_year: 2050
  linkage_type: one-way demand-shock transmission

scenarios:
  baseline: BS
  preference_driven: [A1, A2, A3, A4, A5, A6]
  healthy_diet: [B1, B2, B3, B4, B5, B6]
  moderate_transition: [C1, C2, C3, C4, C5, C6]
  core_cases:
    PTS: A1
    HDS: B1
    MTS: C1
  population_2050_billion:
    medium: 1.2586
    high: 1.389
    low: 1.200
    adult_equivalent: 1.2697

accounting_boundaries:
  farm_gate_carbon:
    coefficient_file: modules/coefficients/carbon_footprint_coefficients.csv
    main_indicator: co2_faostat
    allowed_for_global_net_effect: true
  lifecycle_carbon:
    coefficient_file: modules/coefficients/carbon_footprint_coefficients.csv
    main_indicator: co2_pn_lca
    allowed_for_global_net_effect: false
    note: Use only as a final-consumption footprint sensitivity.
  blue_water:
    coefficient_file: modules/coefficients/water_footprint_coefficients.csv
    headline_component: blue
  nitrogen:
    coefficient_file: modules/coefficients/nitrogen_coefficients.csv
    note: Crop fertilizer and livestock excretion are direct-process proxies; virtual-N factors must not be added to the same direct total without a separate boundary.
  land:
    coefficient_file: modules/coefficients/land_coefficients.csv
    land_occupation_equivalent: true
    physical_harvested_area_indicator: land_harvested

key_output_files:
  china_results: results/results_long.csv
  world_results: results/world/world_results_long.csv
  china_footprints: results/footprints/china_footprints_summary.csv
  world_footprints: results/footprints/world_footprints_summary.csv
  mts_realisation: results/post_analysis/mts_efficiency.csv
  coefficient_boundary_audit: modules/coefficients/coefficient_boundary_audit.csv
  number_registry: results/audit/submission_number_registry.csv

