project:
  name: food_demand_2050
  repository_path: food_demand_2050
  canonical_manuscript: manuscript/manuscript_v3_casm_world.md
  supplementary_information: manuscript/supplementary_information_v3_casm_world.md
  cover_letter: manuscript/cover_letter_nature_communications_draft.md
  archived_manuscript: manuscript/manuscript_v2.md
  target_journal_route: Nature Communications-oriented after model promotion
  manuscript_status: diagnostic_conditional_scenario_not_submission_ready
  hold_reason:
    - underlying_casm_world_v2_passes_18_of_20_publication_gates
    - shared_crop_resource_response_not_implemented

model:
  china_source_model: CASM v2.2.7
  world_model: CASM-World rebuild 2050 V2
  solved_economy_accounts: 193
  world_product_count: 31
  china_shifted_world_products: 19
  benchmark_year: 2023
  final_year: 2050
  linkage_type: exogenous_china_preference_path_with_global_equilibrium_price_feedback
  trade_boundary: residual_net_trade_no_bilateral_flows
  supply_boundary: independent_product_supply_no_shared_crop_resource

scenarios:
  baseline: {paper_code: BASELINE, source_china_code: BS}
  preference_driven: {paper_code: PTS, source_china_code: A1}
  moderate: {paper_code: MTS, source_china_code: C1}
  composite_guideline: {paper_code: CGS, source_china_code: B1}
  central_ssp: SSP2
  main_grid:
    SSP2: annual_2023_2050
    SSP1_SSP3_SSP4_SSP5: endpoints_2023_2050
  sensitivity:
    response_variants: [V2_LOW_RESPONSE, V2_CENTRAL, V2_HIGH_RESPONSE]
    demand_form: DEMAND_SUBSTITUTION_CES

accounting_boundaries:
  primary_production:
    products: [RIC, WHE, CRN, OCG, SBS, NBS, RBS, SCA, SBE, BFV, PRK, PLM, MLK]
    processed_products_excluded_to_prevent_double_counting: true
  ghg:
    boundary: frozen_2023_attributed_biological_farm_gate_production
    lifecycle_claim_allowed: false
    land_use_change_included: false
  nutrition:
    boundary: model_covered_edible_basket_only
    health_or_adequacy_claim_allowed: false

key_output_files:
  run_report: results/casm_world_rebuild/counterfactual_run_report.json
  analysis_report: results/casm_world_rebuild/analysis_report.json
  country_product: results/casm_world_rebuild/counterfactual_country_product.csv.gz
  country_contrasts: results/casm_world_rebuild/country_contrasts_2050.csv.gz
  group_contrasts: results/casm_world_rebuild/group_contrasts_2050.csv.gz
  world_prices: results/casm_world_rebuild/counterfactual_world_prices.csv
  ghg_country: results/casm_world_rebuild/ghg_country.csv.gz
  ghg_group: results/casm_world_rebuild/ghg_group.csv.gz
  sensitivity_prices: results/casm_world_rebuild/sensitivity_world_prices_2050.csv
  tables: results/casm_world_rebuild/tables
  figures: figures/casm_world_rebuild
  claims_registry: results/casm_world_rebuild/claims_registry.csv

